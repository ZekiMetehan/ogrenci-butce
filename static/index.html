<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Öğrenci Bütçe</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 620px; margin: 32px auto; padding: 0 16px; color: #222; }
  h1 { margin-bottom: 4px; }
  .kart { border: 1px solid #ddd; border-radius: 10px; padding: 16px; margin: 18px 0; }
  .kart h2 { margin: 0 0 12px; font-size: 18px; }
  label { display: block; margin: 8px 0 4px; font-size: 14px; color: #555; }
  input { width: 100%; box-sizing: border-box; padding: 8px; font-size: 15px; border: 1px solid #bbb; border-radius: 6px; }
  .satir { display: flex; gap: 10px; }
  .satir > div { flex: 1; }
  button { margin-top: 12px; padding: 9px 18px; font-size: 15px; border: 0; border-radius: 6px; background: #B4570A; color: #fff; cursor: pointer; }
  .sonuc { margin-top: 12px; font-size: 15px; }
  .buyuk { font-size: 22px; font-weight: 700; }
  .eksi { color: #c00; }
  .arti { color: #1a7f37; }
  small { color: #777; }
</style>
</head>
<body>
  <h1>💸 Öğrenci Bütçe</h1>
  <p>Bu ay yemeğe, otobüse ve sabit giderlere ne gideceğini, geriye ne kalacağını hesapla.</p>

  <div class="kart">
    <h2>📆 Hangi ay?</h2>
    <input type="month" id="donem">
  </div>

  <div class="kart">
    <h2>🍽️ Yemek kartı</h2>
    <div class="satir">
      <div><label>Bir öğün ücreti (TL)</label><input type="number" id="ogun_ucreti" min="0" step="0.5" value="45"></div>
      <div><label>Günde kaç öğün?</label><input type="number" id="gunluk_ogun" min="0" max="5" value="1"></div>
    </div>
    <button onclick="yemekHesapla()">Hesapla</button>
    <div class="sonuc" id="yemek_sonuc"></div>
  </div>
  <div class="kart">
    <h2>🚌 Ulaşım</h2>
    <div class="satir">
      <div><label>Günde kaç yolculuk? (gidiş + dönüş = 2)</label><input type="number" id="gunluk_yolculuk" min="0" value="2"></div>
      <div><label>Bir yolculukta kaç kez biniyorsun? (aktarma varsa 2)</label><input type="number" id="yolculuk_basina_binis" min="1" value="1"></div>
    </div>
    <div class="satir">
      <div><label>Biniş ücreti (TL)</label><input type="number" id="binis_ucreti" min="0" step="0.5" value="20"></div>
      <div><label>Aktarma ücreti (TL)</label><input type="number" id="aktarma_ucreti" min="0" step="0.5" value="0"></div>
    </div>
    <small>Aktarma süresi içinde binince ücret alınmıyorsa aktarma ücretini 0 bırak.</small><br>
    <button onclick="ulasimHesapla()">Hesapla</button>
    <div class="sonuc" id="ulasim_sonuc"></div>
  </div>

  <div class="kart">
    <h2>💰 Aylık özet</h2>
    <label>Bu ay eline geçen para (burs, harçlık, KYK…)</label>
    <input type="number" id="gelen_para" min="0" placeholder="ör. 4000">
    <div class="satir">
      <div><label>Yurt ücreti / ev kirası (TL)</label><input type="number" id="konaklama" min="0" value="0"></div>
      <div><label>Telefon faturası (TL)</label><input type="number" id="telefon" min="0" value="0"></div>
    </div>
    <button onclick="ozetGoster()">Özeti göster</button>
    <div class="sonuc" id="ozet_sonuc"></div>
  </div>

<script>
const bugun = new Date();
document.getElementById("donem").value = bugun.toISOString().slice(0, 7);

function sayi(id) { return Number(document.getElementById(id).value); }
function tl(x) { return x.toLocaleString("tr-TR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " TL"; }
function donem() {
  const [yil, ay] = document.getElementById("donem").value.split("-").map(Number);
  return { yil, ay };
}

async function istek(adres, veri) {
  const cevap = await fetch(adres, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(veri)
  });
  if (!cevap.ok) throw new Error("Lütfen bütün kutuları doğru doldur.");
  return cevap.json();
}

let yemekToplam = null;
async function yemekHesapla() {
  const kutu = document.getElementById("yemek_sonuc");
  try {
    const s = await istek("/api/yemek", { ...donem(), ogun_ucreti: sayi("ogun_ucreti"), gunluk_ogun: sayi("gunluk_ogun") });
    yemekToplam = s.toplam;
    kutu.innerHTML = `Bu ay <b>${s.is_gunu} iş günü</b> var → <b>${s.toplam_ogun} öğün</b><br>
      Yemek kartına yüklemen gereken: <span class="buyuk">${tl(s.toplam)}</span>`;
  } catch (e) { kutu.innerHTML = `<span class="eksi">${e.message}</span>`; }
}
let ulasimToplam = null;
async function ulasimHesapla() {
  const kutu = document.getElementById("ulasim_sonuc");
  try {
    const s = await istek("/api/ulasim", {
      ...donem(),
      gunluk_yolculuk: sayi("gunluk_yolculuk"),
      yolculuk_basina_binis: sayi("yolculuk_basina_binis"),
      binis_ucreti: sayi("binis_ucreti"),
      aktarma_ucreti: sayi("aktarma_ucreti")
    });
    ulasimToplam = s.toplam;
    kutu.innerHTML = `${s.is_gunu} iş günü × ${s.gunluk_yolculuk} yolculuk = <b>${s.toplam_yolculuk} yolculuk</b>
      (${s.toplam_aktarma} aktarma)<br>
      Aylık otobüs parası: <span class="buyuk">${tl(s.toplam)}</span>`;
  } catch (e) { kutu.innerHTML = `<span class="eksi">${e.message}</span>`; }
}

async function ozetGoster() {
  const kutu = document.getElementById("ozet_sonuc");
  if (yemekToplam === null || ulasimToplam === null) {
    kutu.innerHTML = `<span class="eksi">Önce yemek ve ulaşım hesabını yap.</span>`;
    return;
  }
  try {
    const s = await istek("/api/ozet", {
      ...donem(),
      gelen_para: sayi("gelen_para"),
      yemek: yemekToplam,
      ulasim: ulasimToplam,
      konaklama: sayi("konaklama"),
      telefon: sayi("telefon")
    });
    kutu.innerHTML = `Yemek: ${tl(yemekToplam)} · Ulaşım: ${tl(ulasimToplam)}<br>
      Yurt/kira: ${tl(sayi("konaklama"))} · Telefon: ${tl(sayi("telefon"))}<br>
      Toplam zorunlu gider: <b>${tl(s.toplam_gider)}</b><br>
      Geriye kalan: <span class="buyuk ${s.yetiyor_mu ? "arti" : "eksi"}">${tl(s.kalan)}</span><br>
      ${s.yetiyor_mu
        ? `Bu ay <b>günde ${tl(s.gunluk_harcanabilir)}</b> harcayabilirsin (${s.gun_sayisi} gün).`
        : `<span class="eksi">⚠️ Gelen para zorunlu giderlere yetmiyor.</span>`}`;
  } catch (e) { kutu.innerHTML = `<span class="eksi">${e.message}</span>`; }
}
</script>
</body>
</html>
